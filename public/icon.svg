<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Athletic Dumbbell Core -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Center Bar -->
    <rect x="140" y="236" width="232" height="40" rx="10" fill="url(#accentGrad)"/>
    <!-- Center Grip Ridges -->
    <rect x="220" y="232" width="8" height="48" rx="4" fill="#a5b4fc" opacity="0.6"/>
    <rect x="236" y="232" width="8" height="48" rx="4" fill="#a5b4fc" opacity="0.6"/>
    <rect x="252" y="232" width="8" height="48" rx="4" fill="#a5b4fc" opacity="0.6"/>
    <rect x="268" y="232" width="8" height="48" rx="4" fill="#a5b4fc" opacity="0.6"/>
    <rect x="284" y="232" width="8" height="48" rx="4" fill="#a5b4fc" opacity="0.6"/>

    <!-- Left Inner Weight Plate -->
    <rect x="120" y="166" width="32" height="180" rx="14" fill="#6366f1"/>
    <!-- Left Outer Weight Plate -->
    <rect x="80" y="196" width="32" height="120" rx="14" fill="#4f46e5"/>

    <!-- Right Inner Weight Plate -->
    <rect x="360" y="166" width="32" height="180" rx="14" fill="#6366f1"/>
    <!-- Right Outer Weight Plate -->
    <rect x="400" y="196" width="32" height="120" rx="14" fill="#4f46e5"/>
  </g>

  <!-- AI Energy Spark / Lightning Badge -->
  <path d="M 270,120 L 220,240 L 280,240 L 230,380 L 330,220 L 270,220 Z" fill="url(#goldGrad)" opacity="0.95"/>
</svg>
